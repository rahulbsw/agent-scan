name: DCO

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  signoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify commit signoffs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          rev_list_args=("${BASE_SHA}..${HEAD_SHA}")
          if [[ "${HEAD_REF}" == "sync/upstream-"* || "${HEAD_REF}" == "agent/sync-upstream-"* ]]; then
            echo "Upstream sync branch detected; checking first-parent commits only."
            rev_list_args=(--first-parent "${BASE_SHA}..${HEAD_SHA}")
          fi

          missing=0
          for commit in $(git rev-list "${rev_list_args[@]}"); do
            if ! git log -1 --format=%B "$commit" | grep -Eiq '^Signed-off-by: .+ <.+@.+>$'; then
              echo "::error::Commit $commit is missing a DCO Signed-off-by line."
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "Use 'git commit -s' or add Signed-off-by: Name <email> to each commit."
            exit 1
          fi
