name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, for example v0.1.0"
        required: true
        type: string
      pypi_only:
        description: "Publish existing GitHub release Python assets to PyPI without rebuilding"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  prepare-release:
    name: prepare release
    runs-on: ubuntu-latest
    outputs:
      checkout_ref: ${{ steps.resolve.outputs.checkout_ref }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
    steps:
      - name: Resolve release inputs
        id: resolve
        shell: bash
        env:
          RAW_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          raw_tag="${RAW_TAG#refs/tags/}"
          raw_tag="${raw_tag#refs/heads/}"

          if [[ ! "$raw_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?$ ]]; then
            echo "::error::Release tag must be vMAJOR.MINOR.PATCH (optionally aN, bN, or rcN)."
            exit 1
          fi
          checkout_ref="$raw_tag"
          release_tag="$raw_tag"

          echo "checkout_ref=$checkout_ref" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

  validate-ref:
    name: validate release ref
    runs-on: ubuntu-latest
    needs: prepare-release
    steps:
      - uses: actions/checkout@v4
      - name: Confirm checkout ref exists
        env:
          CHECKOUT_REF: ${{ needs.prepare-release.outputs.checkout_ref }}
        run: |
          set -euo pipefail

          if ! git ls-remote --exit-code origin "refs/tags/$CHECKOUT_REF" >/dev/null; then
            echo "::error::Release tag '$CHECKOUT_REF' does not exist in this repository."
            exit 1
          fi

  build-binaries:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.pypi_only }}
    name: binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs:
      - prepare-release
      - validate-ref
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            ext: ""
            archive_ext: ".tar.gz"
          - os: ubuntu-24.04-arm
            target: linux-arm64
            ext: ""
            archive_ext: ".tar.gz"
          - os: macos-latest
            target: macos-arm64
            ext: ""
            archive_ext: ".tar.gz"
          - os: macos-15-intel
            target: macos-x64
            ext: ""
            archive_ext: ".tar.gz"
          - os: windows-latest
            target: windows-x64
            ext: ".exe"
            archive_ext: ".zip"
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.checkout_ref }}
      - uses: astral-sh/setup-uv@v6
      - name: Build standalone binary
        run: make binary
      - name: Stage release asset
        shell: bash
        env:
          BINARY_PATH: dist/open-agent-scan${{ matrix.ext }}
          BINARY_NAME: open-agent-scan${{ matrix.ext }}
          ASSET_NAME: open-agent-scan-${{ needs.prepare-release.outputs.release_tag }}-${{ matrix.target }}${{ matrix.archive_ext }}
        run: |
          set -euo pipefail
          mkdir -p release-assets

          case "$ASSET_NAME" in
            *.zip)
              python - <<'PY'
          import os
          import zipfile

          archive_path = os.path.join("release-assets", os.environ["ASSET_NAME"])
          with zipfile.ZipFile(archive_path, "w", zipfile.ZIP_DEFLATED) as archive:
              archive.write(os.environ["BINARY_PATH"], os.environ["BINARY_NAME"])
          PY
              ;;
            *.tar.gz)
              tar -czf "release-assets/$ASSET_NAME" -C dist "$BINARY_NAME"
              ;;
            *)
              echo "::error::Unsupported release asset archive type: $ASSET_NAME"
              exit 1
              ;;
          esac
      - name: Attest binary provenance
        uses: actions/attest@v4
        with:
          subject-path: "release-assets/*"
      - uses: actions/upload-artifact@v4
        with:
          name: open-agent-scan-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error

  build-python-package:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.pypi_only }}
    name: python package
    runs-on: ubuntu-latest
    needs:
      - prepare-release
      - validate-ref
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.checkout_ref }}
      - uses: astral-sh/setup-uv@v6
      - name: Build wheel and source distribution
        run: make build
      - name: Stage release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp dist/*.whl dist/*.tar.gz release-assets/
      - name: Attest package provenance
        uses: actions/attest@v4
        with:
          subject-path: "release-assets/*"
      - uses: actions/upload-artifact@v4
        with:
          name: open-agent-scan-python-package
          path: release-assets/*
          if-no-files-found: error

  publish-release:
    name: publish release
    runs-on: ubuntu-latest
    needs:
      - prepare-release
      - build-binaries
      - build-python-package
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.checkout_ref }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: release-assets
          format: spdx-json
          output-file: release-assets/sbom-${{ needs.prepare-release.outputs.release_tag }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum * > sha256sums.txt
      - name: Attest release SBOM
        uses: actions/attest@v4
        with:
          subject-path: |
            release-assets/open-agent-scan-*
            release-assets/open_agent_scan-*
          sbom-path: release-assets/sbom-${{ needs.prepare-release.outputs.release_tag }}.spdx.json
      - name: Write release notes
        env:
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        run: |
          set -euo pipefail

          upstream_base="$(git describe --tags --match 'v*' --exclude "$RELEASE_TAG" --abbrev=0 2>/dev/null || true)"
          if [ -z "$upstream_base" ]; then
            upstream_base="see retained git history and FORK_MAINTENANCE.md"
          fi

          {
            echo "Open Agent Scan $RELEASE_TAG"
            echo
            echo "Open Agent Scan is an independent downstream derivative of snyk/agent-scan."
            echo "It is not affiliated with, sponsored by, or endorsed by Snyk or Invariant Labs."
            echo
            echo "Upstream base version: $upstream_base"
            echo
            echo "Standalone CLI binaries are packaged as .tar.gz archives on macOS/Linux and .zip on Windows."
            echo "Extract the archive, then run open-agent-scan from a terminal."
            echo
            echo "macOS example:"
            echo '  tar -xzf open-agent-scan-'"$RELEASE_TAG"'-macos-arm64.tar.gz'
            echo '  xattr -d com.apple.quarantine open-agent-scan 2>/dev/null || true'
            echo '  ./open-agent-scan --help'
            echo
            echo "Release assets include checksums, an SPDX SBOM, and GitHub artifact attestations."
          } > release-notes.md
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        run: |
          set -euo pipefail

          case "$RELEASE_TAG" in
            v*) ;;
            *) echo "Release tag must start with v"; exit 1 ;;
          esac

          target_sha="$(git rev-parse HEAD)"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "Open Agent Scan $RELEASE_TAG" --notes-file release-notes.md
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* --title "Open Agent Scan $RELEASE_TAG" --target "$target_sha" --notes-file release-notes.md
          fi

  publish-pypi:
    name: publish Python package to PyPI
    needs:
      - prepare-release
      - validate-ref
      - publish-release
    if: >-
      ${{ !cancelled() && github.repository == 'rahulbsw/agent-scan' &&
          needs.prepare-release.result == 'success' && needs.validate-ref.result == 'success' &&
          ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
           (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) &&
          (needs.publish-release.result == 'success' ||
           (github.event_name == 'workflow_dispatch' && inputs.pypi_only)) }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/open-agent-scan/
    concurrency:
      group: pypi-${{ needs.prepare-release.outputs.release_tag }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download published Python distributions and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        run: |
          set -euo pipefail
          gh release download "$RELEASE_TAG" --repo rahulbsw/agent-scan \
            --pattern 'open_agent_scan-*.whl' --pattern 'open_agent_scan-*.tar.gz' --dir dist
          gh release download "$RELEASE_TAG" --repo rahulbsw/agent-scan \
            --pattern sha256sums.txt --dir release-metadata
      - name: Verify distribution identity, version, and checksums
        env:
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        run: |
          python - <<'PY'
          import hashlib
          import os
          import tarfile
          import zipfile
          from email.parser import BytesParser
          from pathlib import Path

          version = os.environ["RELEASE_TAG"][1:]
          wheel = f"open_agent_scan-{version}-py3-none-any.whl"
          sdist = f"open_agent_scan-{version}.tar.gz"
          directory = Path("dist")
          files = {path.name for path in directory.iterdir()}
          if files != {wheel, sdist}:
              raise SystemExit("Expected exactly the release version's wheel and source distribution")
          checksums = {}
          for line in Path("release-metadata/sha256sums.txt").read_text().splitlines():
              digest, name = line.split(maxsplit=1)
              name = name.lstrip(" *")
              if name in checksums:
                  raise SystemExit("Duplicate checksum entry")
              checksums[name] = digest
          for name in (wheel, sdist):
              digest = hashlib.sha256((directory / name).read_bytes()).hexdigest()
              if checksums.get(name) != digest:
                  raise SystemExit("Distribution checksum mismatch")
          with zipfile.ZipFile(directory / wheel) as archive:
              names = [name for name in archive.namelist() if name.endswith(".dist-info/METADATA")]
              if len(names) != 1 or archive.getinfo(names[0]).file_size > 4 * 1024 * 1024:
                  raise SystemExit("Unexpected wheel metadata")
              metadata = [archive.read(names[0])]
          with tarfile.open(directory / sdist, "r:gz") as archive:
              member = archive.getmember(f"open_agent_scan-{version}/PKG-INFO")
              if not member.isfile() or member.size > 4 * 1024 * 1024:
                  raise SystemExit("Unexpected source metadata")
              metadata.append(archive.extractfile(member).read())
          for data in metadata:
              parsed = BytesParser().parsebytes(data)
              name = parsed.get("Name", "").lower().replace("_", "-")
              if name != "open-agent-scan" or parsed.get("Version") != version:
                  raise SystemExit("Package name/version does not match this release")
          print(f"Verified both open-agent-scan {version} distributions against release checksums")
          PY
      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist/
          skip-existing: true
          attestations: true
