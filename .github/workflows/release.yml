name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  prepare-release:
    name: prepare release
    runs-on: ubuntu-latest
    outputs:
      checkout_ref: ${{ steps.resolve.outputs.checkout_ref }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
    steps:
      - name: Resolve release inputs
        id: resolve
        shell: bash
        env:
          RAW_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          raw_tag="${RAW_TAG#refs/tags/}"
          raw_tag="${raw_tag#refs/heads/}"

          case "$raw_tag" in
            v*)
              checkout_ref="$raw_tag"
              release_tag="$raw_tag"
              ;;
            *)
              echo "::error::Release tag must be v<version>. Got: $raw_tag"
              exit 1
              ;;
          esac

          echo "checkout_ref=$checkout_ref" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

  validate-ref:
    name: validate release ref
    runs-on: ubuntu-latest
    needs: prepare-release
    steps:
      - uses: actions/checkout@v4
      - name: Confirm checkout ref exists
        env:
          CHECKOUT_REF: ${{ needs.prepare-release.outputs.checkout_ref }}
        run: |
          set -euo pipefail

          if ! git ls-remote --exit-code origin "refs/tags/$CHECKOUT_REF" >/dev/null; then
            echo "::error::Release tag '$CHECKOUT_REF' does not exist in this repository."
            exit 1
          fi

  build-binaries:
    name: binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs:
      - prepare-release
      - validate-ref
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            ext: ""
            archive_ext: ".tar.gz"
          - os: ubuntu-24.04-arm
            target: linux-arm64
            ext: ""
            archive_ext: ".tar.gz"
          - os: macos-latest
            target: macos-arm64
            ext: ""
            archive_ext: ".tar.gz"
          - os: macos-15-intel
            target: macos-x64
            ext: ""
            archive_ext: ".tar.gz"
          - os: windows-latest
            target: windows-x64
            ext: ".exe"
            archive_ext: ".zip"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.checkout_ref }}
      - uses: astral-sh/setup-uv@v6
      - name: Build standalone binary
        run: make binary
      - name: Stage release asset
        shell: bash
        env:
          BINARY_PATH: dist/open-agent-scan${{ matrix.ext }}
          BINARY_NAME: open-agent-scan${{ matrix.ext }}
          ASSET_NAME: open-agent-scan-${{ needs.prepare-release.outputs.release_tag }}-${{ matrix.target }}${{ matrix.archive_ext }}
        run: |
          set -euo pipefail
          mkdir -p release-assets

          case "$ASSET_NAME" in
            *.zip)
              python - <<'PY'
          import os
          import zipfile

          archive_path = os.path.join("release-assets", os.environ["ASSET_NAME"])
          with zipfile.ZipFile(archive_path, "w", zipfile.ZIP_DEFLATED) as archive:
              archive.write(os.environ["BINARY_PATH"], os.environ["BINARY_NAME"])
          PY
              ;;
            *.tar.gz)
              tar -czf "release-assets/$ASSET_NAME" -C dist "$BINARY_NAME"
              ;;
            *)
              echo "::error::Unsupported release asset archive type: $ASSET_NAME"
              exit 1
              ;;
          esac
      - name: Attest binary provenance
        uses: actions/attest@v4
        with:
          subject-path: "release-assets/*"
      - uses: actions/upload-artifact@v4
        with:
          name: open-agent-scan-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error

  build-python-package:
    name: python package
    runs-on: ubuntu-latest
    needs:
      - prepare-release
      - validate-ref
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.checkout_ref }}
      - uses: astral-sh/setup-uv@v6
      - name: Build wheel and source distribution
        run: make build
      - name: Stage release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp dist/*.whl dist/*.tar.gz release-assets/
      - name: Attest package provenance
        uses: actions/attest@v4
        with:
          subject-path: "release-assets/*"
      - uses: actions/upload-artifact@v4
        with:
          name: open-agent-scan-python-package
          path: release-assets/*
          if-no-files-found: error

  publish-release:
    name: publish release
    runs-on: ubuntu-latest
    needs:
      - prepare-release
      - build-binaries
      - build-python-package
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.checkout_ref }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: release-assets
          format: spdx-json
          output-file: release-assets/sbom-${{ needs.prepare-release.outputs.release_tag }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum * > sha256sums.txt
      - name: Attest release SBOM
        uses: actions/attest@v4
        with:
          subject-path: |
            release-assets/open-agent-scan-*
            release-assets/open_agent_scan-*
          sbom-path: release-assets/sbom-${{ needs.prepare-release.outputs.release_tag }}.spdx.json
      - name: Write release notes
        env:
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        run: |
          set -euo pipefail

          upstream_base="$(git describe --tags --match 'v*' --exclude "$RELEASE_TAG" --abbrev=0 2>/dev/null || true)"
          if [ -z "$upstream_base" ]; then
            upstream_base="see retained git history and FORK_MAINTENANCE.md"
          fi

          {
            echo "Open Agent Scan $RELEASE_TAG"
            echo
            echo "Open Agent Scan is an independent downstream derivative of snyk/agent-scan."
            echo "It is not affiliated with, sponsored by, or endorsed by Snyk or Invariant Labs."
            echo
            echo "Upstream base version: $upstream_base"
            echo
            echo "Standalone CLI binaries are packaged as .tar.gz archives on macOS/Linux and .zip on Windows."
            echo "Extract the archive, then run open-agent-scan from a terminal."
            echo
            echo "macOS example:"
            echo '  tar -xzf open-agent-scan-'"$RELEASE_TAG"'-macos-arm64.tar.gz'
            echo '  xattr -d com.apple.quarantine open-agent-scan 2>/dev/null || true'
            echo '  ./open-agent-scan --help'
            echo
            echo "Release assets include checksums, an SPDX SBOM, and GitHub artifact attestations."
          } > release-notes.md
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        run: |
          set -euo pipefail

          case "$RELEASE_TAG" in
            v*) ;;
            *) echo "Release tag must start with v"; exit 1 ;;
          esac

          target_sha="$(git rev-parse HEAD)"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "Open Agent Scan $RELEASE_TAG" --notes-file release-notes.md
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* --title "Open Agent Scan $RELEASE_TAG" --target "$target_sha" --notes-file release-notes.md
          fi
